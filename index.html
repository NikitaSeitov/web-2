<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>МАШИНА СОГЛАСИЯ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" data-state="VIDEO_MODE" class="app" role="application">
    <div class="media">
      <video id="bgVideo" autoplay loop muted playsinline preload="auto" aria-hidden="true">
        <source src="assets/video.mp4" type="video/mp4">
      </video>

      <div id="videoPlaceholder" class="video-placeholder" hidden>
        <div class="placeholder-inner">
          <!-- <svg width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.2"/>
            <path d="M8 10l3 2 5-3v6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="placeholder-text">Видео недоступно</div> -->
        </div>
      </div>

      <div id="videoDim" class="video-dim" aria-hidden="true"></div>
    </div>

    <!-- Overlay elements placed near edges to avoid video center -->
    <div class="overlay top">
      <div class="overlay-inner">
        <div class="top-left">
          <h1 class="title">МАШИНА СОГЛАСИЯ</h1>
        </div>

        <!-- <div class="top-right">
          <p class="caption">Ваши ответы станут частью коллективного портрета отношения людей к ИИ</p>
        </div> -->
      </div>
    </div>

    <div class="overlay bottom">
      <div class="overlay-inner">
        <div class="bottom-center">
          <div class="interaction-stack">
            <div class="buttons-row">
              <button id="startSurvey" class="glass-btn survey-cta" aria-label="Пройти опрос">
                <span class="cta-main">ПРОЙТИ ОПРОС</span>
              </button>
              <button id="openStats" class="glass-btn secondary" aria-label="Посмотреть статистику">ПОСМОТРЕТЬ СТАТИСТИКУ</button>
            </div>
            <p class="cta-copy">Ваши ответы станут частью коллективного портрета отношения людей к ИИ</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Survey will render into this root -->
    <div id="surveyRoot" aria-live="polite"></div>
  </main>

  <script src="survey.js" defer></script>
  <script src="charts.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
